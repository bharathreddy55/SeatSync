server {
    listen 80;
    server_name yourdomain.com; # Replace with your public domain name or IP

    # Redirect all HTTP requests to HTTPS (Optional but recommended for production)
    # return 301 https://$host$request_uri;

    location / {
        # Forward public traffic to the API Gateway port 8085
        proxy_pass https://localhost:8085;
        proxy_ssl_verify off; # Since API Gateway uses a self-signed dev keystore inside Tomcat
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Required for real-time seat lock updates)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
