version: '3.8'

services:
  # Databases
  postgres-db:
    image: postgres:15-alpine
    container_name: seatsync-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./docker/db-init:/docker-entrypoint-initdb.d
    networks:
      - seatsync-network

  # Redis Cache & Locks
  redis:
    image: redis:7-alpine
    container_name: seatsync-redis
    ports:
      - "6379:6379"
    networks:
      - seatsync-network

  # Mail server
  maildev:
    image: maildev/maildev
    container_name: seatsync-maildev
    ports:
      - "1080:1080"
      - "1025:1025"
    networks:
      - seatsync-network

  # Messaging
  zookeeper:
    image: confluentinc/cp-zookeeper:7.3.0
    container_name: seatsync-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - seatsync-network

  kafka:
    image: confluentinc/cp-kafka:7.3.0
    container_name: seatsync-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - seatsync-network

  # Spring Cloud Eureka Discovery Server
  discovery-server:
    build:
      context: .
      dockerfile: discovery-server/Dockerfile
    container_name: seatsync-discovery
    ports:
      - "8761:8761"
    networks:
      - seatsync-network

  # Spring Cloud API Gateway
  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    container_name: seatsync-gateway
    ports:
      - "8085:8080"
    depends_on:
      - discovery-server
      - redis
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      REDIS_HOST: redis
      REDIS_PORT: 6379
    networks:
      - seatsync-network

  # User Service
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: seatsync-user-service
    ports:
      - "8081:8081"
    depends_on:
      - postgres-db
      - discovery-server
      - redis
      - kafka
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: seatsync_user_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    networks:
      - seatsync-network

  # Event Service
  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    container_name: seatsync-event-service
    ports:
      - "8082:8082"
    depends_on:
      - postgres-db
      - redis
      - discovery-server
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: seatsync_event_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
    networks:
      - seatsync-network

  # Booking Service
  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: seatsync-booking-service
    ports:
      - "8083:8083"
    depends_on:
      - postgres-db
      - redis
      - kafka
      - discovery-server
    environment:
      DB_HOST: postgres-db
      DB_PORT: 5432
      DB_NAME: seatsync_booking_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      SERVICES_EVENT-SERVICE_URL: http://event-service
    networks:
      - seatsync-network

  # Notification Service
  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: seatsync-notification-service
    ports:
      - "8084:8084"
    depends_on:
      - kafka
      - discovery-server
      - maildev
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-server:8761/eureka/
      MAIL_HOST: maildev
      MAIL_PORT: 1025
    networks:
      - seatsync-network

networks:
  seatsync-network:
    driver: bridge
